# Controlled continuation: 10-epoch freeze, then train the backbone at 0.1x detector LR.
# TorchVision weights load only when this recipe is used for a fresh training run.
source:
  paper: "Redmon and Farhadi, YOLOv3: An Incremental Improvement (2018)"
  paper_url: https://arxiv.org/abs/1804.02767
  backbone_reference: https://docs.pytorch.org/vision/main/models/generated/torchvision.models.convnext_small.html
  adaptations:
    - "Continues the 10-epoch frozen-head run; only sets the backbone learning-rate multiplier to 0.1 after unfreezing."
    - "Keeps the project's YOLOv3 anchors, three-scale neck/head topology and internal widths, labels, loss, optimizer and schedule; the backbone changes from Darknet-53 to ConvNeXt-Small and lateral input channels adapt to its features."
    - "Uses TorchVision ConvNeXt_Small_Weights.IMAGENET1K_V1 classification pretraining and its RGB mean/std normalization."
    - "This is a YOLOv3-head engineering variant, not the 2018 paper architecture or a strict YOLOv3 reproduction."
    - "Retains fixed 416 input and the project augmentation; it does not add Darknet random multi-scale resizing or jittered crop."
model:
  architecture: yolov3
  backbone_name: convnext_small
  backbone_weights: IMAGENET1K_V1
  anchors:
    - [10, 13]
    - [16, 30]
    - [33, 23]
    - [30, 61]
    - [62, 45]
    - [59, 119]
    - [116, 90]
    - [156, 198]
    - [373, 326]
  anchor_masks:
    - [6, 7, 8]
    - [3, 4, 5]
    - [0, 1, 2]
dataset_config: configs/datasets/voc0712_trainmix.yaml
input_size: 416
grid_size: 13
boxes_per_cell: 3
epochs: 200
micro_batch_size: 16
effective_batch_size: 64
precision: bf16
num_workers: 4
seed: 42
checkpoint_interval_epochs: 10
freeze_backbone_epochs: 10
optimizer:
  name: SGD
  learning_rate: 0.001
  backbone_lr_multiplier: 0.1
  warmup_initial_learning_rate: 0.0001
  warmup_epochs: 4
  momentum: 0.9
  weight_decay: 0.0005
  decay_epochs: [160, 180]
  decay_factor: 0.1
training_augmentation:
  scale_range: [0.8, 1.2]
  translate: 0.2
  saturation: 1.5
  exposure: 1.5
  hue: 0.1
loss:
  coord_scale: 1.0
  object_scale: 1.0
  noobject_scale: 1.0
  class_scale: 1.0
  ignore_iou_threshold: 0.5
evaluation:
  interval_epochs: 5
  confidence_threshold: 0.001
  nms_iou_threshold: 0.45
  max_detections: 100

source:
  paper: "CornerNet: Detecting Objects as Paired Keypoints (2018)"
  paper_url: https://arxiv.org/abs/1808.01244
  reference_config: 3dparty/mmdetection/configs/cornernet/cornernet_hourglass104_8xb6-210e-mstest_coco.py
  pretrained_weights: "MMDetection CornerNet Hourglass-104, COCO; URL in docs/versions/cornernet.md"
  adaptations:
    - "Keeps Hourglass-104, bidirectional corner pooling, corner heatmaps, offsets, associative embedding, and Gaussian soft-NMS."
    - "Uses VOC07+12 train/val and square resize instead of the reference center-crop-pad pipeline."
    - "Uses global batch 6 on one GPU; the reference Adam learning rate is linearly scaled from global batch 48."
    - "Uses the reference 210 dataset passes; validation runs every 5 epochs to limit overhead."
model:
  architecture: cornernet
dataset_config: configs/datasets/voc0712_trainmix.yaml
input_size: 511
epochs: 210
micro_batch_size: 1
effective_batch_size: 6
validation_batch_size: 1
precision: bf16
num_workers: 4
seed: 42
freeze_backbone_epochs: 0
checkpoint_interval_epochs: 10
requires_pretrained_checkpoint: true
optimizer:
  name: Adam
  learning_rate: 0.0000625
  weight_decay: 0.0
  warmup_initial_learning_rate: 0.00000625
  warmup_epochs: 0.5
  schedule: multistep
  decay_epochs: [180]
  decay_factor: 0.1
  max_grad_norm: 35
loss:
  pull_weight: 0.1
  push_weight: 0.1
training_augmentation:
  horizontal_flip: 0.5
  scale_range: [0.6, 1.3]
  translate: 0.1
  saturation: 1.5
  exposure: 1.5
  hue: 0.07
evaluation:
  interval_epochs: 5
  confidence_threshold: 0.05
  nms_iou_threshold: 0.5
  max_detections: 100
decoder:
  topk: 100
  embedding_distance: 0.5

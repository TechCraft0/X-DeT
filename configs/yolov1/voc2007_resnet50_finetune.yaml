# Follow the reference ResNet-50 transfer path, then adapt it to fine-tune the
# complete pretrained backbone after a short detector-head warm-up.
source:
  paper: "Redmon et al., You Only Look Once: Unified, Real-Time Object Detection (CVPR 2016)"
  paper_url: https://arxiv.org/abs/1506.02640
  reference_implementations:
    - https://github.com/tanjeffreyz/yolo-v1
    - https://github.com/yakhyo/yolov1-pytorch
  adaptations:
    - "Engineering transfer-learning variant with a torchvision ImageNet-pretrained ResNet-50, not the paper's Darknet architecture."
    - "Freeze the pretrained backbone for five head warm-up epochs, then fine-tune all backbone parameters."
    - "Use Adam as in the ResNet-50 reference; the backbone learning rate is one tenth of the detector-head learning rate."
    - "VOC difficult objects are omitted by the YOLO TXT converter and counted in conversion_report.json."
    - "The local backbone checkpoint is passed explicitly; no weight download occurs during training."
dataset_config: configs/datasets/voc2007.yaml
model:
  architecture: yolov1_resnet50_transfer
  backbone_checkpoint: null # Set by --backbone-checkpoint.
  freeze_backbone: true
freeze_backbone_epochs: 5
input_size: 448
grid_size: 7
boxes_per_cell: 2
epochs: 135
checkpoint_interval_epochs: 10
micro_batch_size: 4
effective_batch_size: 64
num_workers: 4
seed: 42
optimizer:
  name: Adam
  learning_rate: 0.0001
  backbone_lr_multiplier: 0.1
  betas: [0.9, 0.999]
  weight_decay: 0.0
  warmup_epochs: 0
  decay_epochs: []
  decay_factor: 1.0
loss:
  lambda_coord: 5.0
  lambda_noobj: 0.5
training_augmentation:
  scale_range: [0.8, 1.2]
  translate: 0.2
  saturation: 1.5
  exposure: 1.5
  hue: 0.1
evaluation:
  interval_epochs: 5
  confidence_threshold: 0.001
  nms_iou_threshold: 0.45
  max_detections: 100
